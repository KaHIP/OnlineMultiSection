<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="250" rx="12" ry="12" fill="#1a1d23"/>

  <!-- Title: "O" cyan, "M" white, "S" amber -->
  <text x="40" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="56">
    <tspan fill="#00bcd4">O</tspan><tspan fill="#e0e0e0">nline</tspan><tspan fill="#f39c12">M</tspan><tspan fill="#e0e0e0">ulti</tspan><tspan fill="#e74c3c">S</tspan><tspan fill="#e0e0e0">ection</tspan>
  </text>

  <!-- Subtitle -->
  <text x="42" y="125" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#aaaaaa">
    Streaming Process Mapping &amp; Hierarchical Graph Partitioning
  </text>

  <!-- Second subtitle -->
  <text x="42" y="147" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#777777">
    Shared-Memory Recursive Multi-Section on the Fly
  </text>

  <!-- Part of KaHIP badge -->
  <rect x="42" y="165" width="105" height="24" rx="12" ry="12" fill="#5a7a5a" fill-opacity="0.35" stroke="#5a7a5a" stroke-opacity="0.5" stroke-width="1"/>
  <text x="94" y="181.5" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8faa8f">Part of KaHIP</text>

  <!-- CLUSTER 2022 badge -->
  <rect x="158" y="165" width="100" height="24" rx="12" ry="12" fill="#3498db" fill-opacity="0.12" stroke="#3498db" stroke-opacity="0.35" stroke-width="1"/>
  <text x="208" y="181.5" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#3498db">CLUSTER 2022</text>

  <!-- === Hierarchical recursive multi-section diagram (right side) === -->

  <!-- Stream input -->
  <line x1="540" y1="45" x2="620" y2="45" stroke="#555" stroke-width="1.5"/>
  <polygon points="618,41 626,45 618,49" fill="#666"/>
  <text x="580" y="38" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#666">stream</text>

  <!-- Streaming nodes -->
  <circle cx="550" cy="45" r="3.5" fill="#666" opacity="0.2" filter="url(#glow)"/>
  <circle cx="565" cy="45" r="4" fill="#888" opacity="0.35" filter="url(#glow)"/>
  <circle cx="582" cy="45" r="4.5" fill="#aaa" opacity="0.5" filter="url(#glow)"/>
  <circle cx="601" cy="45" r="5" fill="#bbb" opacity="0.65" filter="url(#glow)"/>
  <circle cx="622" cy="45" r="5.5" fill="#ddd" opacity="0.85" filter="url(#glow)"/>

  <!-- Root level: full graph -> 2 sections -->
  <rect x="640" y="28" width="50" height="34" rx="5" ry="5" fill="#ddd" fill-opacity="0.08" stroke="#ddd" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="653" cy="40" r="4" fill="#ddd" opacity="0.6" filter="url(#glow)"/>
  <circle cx="668" cy="48" r="4" fill="#ddd" opacity="0.6" filter="url(#glow)"/>
  <circle cx="678" cy="38" r="4" fill="#ddd" opacity="0.6" filter="url(#glow)"/>
  <line x1="653" y1="40" x2="668" y2="48" stroke="#888" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="668" y1="48" x2="678" y2="38" stroke="#888" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="653" y1="40" x2="678" y2="38" stroke="#888" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Split arrows -->
  <path d="M690,35 Q710,35 720,75" fill="none" stroke="#00bcd4" stroke-width="1.2" stroke-dasharray="3,2" stroke-opacity="0.5"/>
  <path d="M690,55 Q710,55 720,130" fill="none" stroke="#f39c12" stroke-width="1.2" stroke-dasharray="3,2" stroke-opacity="0.5"/>

  <!-- Level 1: two sections -->
  <!-- Section A (cyan) -->
  <rect x="720" y="60" width="65" height="45" rx="5" ry="5" fill="#00bcd4" fill-opacity="0.06" stroke="#00bcd4" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="735" cy="75" r="4.5" fill="#00bcd4" opacity="0.7" filter="url(#glow)"/>
  <circle cx="755" cy="70" r="4.5" fill="#00bcd4" opacity="0.7" filter="url(#glow)"/>
  <circle cx="770" cy="82" r="4.5" fill="#00bcd4" opacity="0.7" filter="url(#glow)"/>
  <circle cx="750" cy="90" r="4.5" fill="#00bcd4" opacity="0.7" filter="url(#glow)"/>
  <line x1="735" y1="75" x2="755" y2="70" stroke="#00bcd4" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="755" y1="70" x2="770" y2="82" stroke="#00bcd4" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="735" y1="75" x2="750" y2="90" stroke="#00bcd4" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Section B (amber) -->
  <rect x="720" y="115" width="65" height="45" rx="5" ry="5" fill="#f39c12" fill-opacity="0.06" stroke="#f39c12" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="735" cy="130" r="4.5" fill="#f39c12" opacity="0.7" filter="url(#glow)"/>
  <circle cx="755" cy="125" r="4.5" fill="#f39c12" opacity="0.7" filter="url(#glow)"/>
  <circle cx="770" cy="137" r="4.5" fill="#f39c12" opacity="0.7" filter="url(#glow)"/>
  <circle cx="750" cy="148" r="4.5" fill="#f39c12" opacity="0.7" filter="url(#glow)"/>
  <line x1="735" y1="130" x2="755" y2="125" stroke="#f39c12" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="755" y1="125" x2="770" y2="137" stroke="#f39c12" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="735" y1="130" x2="750" y2="148" stroke="#f39c12" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Level 2 split arrows from Section A -->
  <path d="M785,70 Q800,70 810,60" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="3,2" stroke-opacity="0.5"/>
  <path d="M785,90 Q800,90 810,100" fill="none" stroke="#2ecc71" stroke-width="1" stroke-dasharray="3,2" stroke-opacity="0.5"/>

  <!-- Level 2 split arrows from Section B -->
  <path d="M785,125 Q800,125 810,155" fill="none" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,2" stroke-opacity="0.5"/>
  <path d="M785,148 Q800,148 810,195" fill="none" stroke="#9b59b6" stroke-width="1" stroke-dasharray="3,2" stroke-opacity="0.5"/>

  <!-- Level 2: four leaf blocks (final assignment) -->
  <!-- Block 1 (blue) -->
  <rect x="810" y="40" width="75" height="35" rx="5" ry="5" fill="#3498db" fill-opacity="0.06" stroke="#3498db" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="830" cy="57" r="5" fill="#3498db" filter="url(#glow)"/>
  <circle cx="855" cy="52" r="5" fill="#3498db" filter="url(#glow)"/>
  <path d="M830,57 Q842,48 855,52" fill="none" stroke="#3498db" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Block 2 (green) -->
  <rect x="810" y="82" width="75" height="35" rx="5" ry="5" fill="#2ecc71" fill-opacity="0.06" stroke="#2ecc71" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="830" cy="99" r="5" fill="#2ecc71" filter="url(#glow)"/>
  <circle cx="855" cy="94" r="5" fill="#2ecc71" filter="url(#glow)"/>
  <path d="M830,99 Q842,90 855,94" fill="none" stroke="#2ecc71" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Block 3 (red) -->
  <rect x="810" y="138" width="75" height="35" rx="5" ry="5" fill="#e74c3c" fill-opacity="0.06" stroke="#e74c3c" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="830" cy="155" r="5" fill="#e74c3c" filter="url(#glow)"/>
  <circle cx="855" cy="150" r="5" fill="#e74c3c" filter="url(#glow)"/>
  <path d="M830,155 Q842,146 855,150" fill="none" stroke="#e74c3c" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Block 4 (purple) -->
  <rect x="810" y="180" width="75" height="35" rx="5" ry="5" fill="#9b59b6" fill-opacity="0.06" stroke="#9b59b6" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="830" cy="197" r="5" fill="#9b59b6" filter="url(#glow)"/>
  <circle cx="855" cy="192" r="5" fill="#9b59b6" filter="url(#glow)"/>
  <path d="M830,197 Q842,188 855,192" fill="none" stroke="#9b59b6" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Hierarchy labels -->
  <text x="665" y="22" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#666">graph</text>
  <text x="752" y="56" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#666">level 1</text>
  <text x="847" y="35" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#666">level 2</text>

  <!-- Bottom: topology visualization -->
  <text x="700" y="235" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#555">
    recursive multi-section for hierarchical process mapping
  </text>

  <!-- Legend -->
  <circle cx="540" cy="222" r="4" fill="#3498db" opacity="0.7"/>
  <text x="550" y="226" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#888">PE 1</text>
  <circle cx="585" cy="222" r="4" fill="#2ecc71" opacity="0.7"/>
  <text x="595" y="226" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#888">PE 2</text>
  <circle cx="630" cy="222" r="4" fill="#e74c3c" opacity="0.7"/>
  <text x="640" y="226" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#888">PE 3</text>
  <circle cx="675" cy="222" r="4" fill="#9b59b6" opacity="0.7"/>
  <text x="685" y="226" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#888">PE 4</text>
</svg>
